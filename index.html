<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>카페 키오스크</title>

        <!-- css -->
        <link href="css/style.css" rel="stylesheet">
    </head>
    <body>
        <main class="kiosk">
            <!-- 왼쪽 영역 : 메뉴 선택 -->
            <section class="menu-area">
                <header class="kiosk-header">
                    <h1>☕ Jazz Cafe</h1>
                    <p>원하는 메뉴를 눌러 주문해 보세요.</p>
                </header>

                <!-- 카테고리 탭: 버튼은 JavaScript가 만들어서 넣는다 -->
                <nav class="tabs"></nav>

                <!-- 메뉴 카드: JavaScript가 만들어서 넣는다 -->
                <div class="menu-grid"></div>
            </section>

            <!-- 오른쪽 영역 : 주문 내역 -->
            <aside class="order-area">
                <h2 class="order-title">🧾 주문 내역</h2>

                <div class="place-row">
                    <button class="place-btn active" type="button" data-place="매장">🪑 매장에서</button>
                    <button class="place-btn" type="button" data-place="포장">🛍️ 포장</button>
                </div>

                <ul class="cart-list"></ul>
                <p class="empty-msg">아직 담은 메뉴가 없어요.<br>왼쪽에서 메뉴를 눌러 주세요!</p>

                <div class="total-box">
                    <span class="total-label">총 결제금액</span>
                    <span class="total-price">0원</span>
                </div>
                <p class="total-count">총 0개</p>

                <div class="btn-row">
                    <button class="clear-btn" type="button">전체 취소</button>
                    <button class="order-btn" type="button">주문하기</button>
                </div>
            </aside>
        </main>

        <!-- 주문 완료 창 -->
        <div class="modal">
            <div class="modal-box">
                <div class="modal-icon">🎉</div>

                <h2>주문이 완료되었습니다!</h2>
                <p class="modal-place"></p>

                <div class="modal-number"></div>
                <ul class="receipt"></ul>
                
                <p class="modal-total"></p>
                <button class="modal-close" type="button">확인</button>
            </div>
        </div>

        <!-- Script -->
        <script src="js/script.js"></script>
    </body>
</html>
